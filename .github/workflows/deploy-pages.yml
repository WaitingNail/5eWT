name: Deploy 5eWT to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out translation overlay
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build and verify the Traditional Chinese site
        run: |
          npm run bootstrap
          npm run apply
          node vendor/5etools-src/node/zh-tw/apply-site-i18n-html.mjs
          npm run verify

      - name: Prepare the static site
        run: |
          test -f vendor/5etools-src/index.html
          rm -rf vendor/5etools-src/.git vendor/5etools-src/node_modules

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: vendor/5etools-src

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
